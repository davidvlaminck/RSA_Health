<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Health</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
            padding: 2rem;
        }
        .header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .header h1 {
            font-size: 1.8rem;
            font-weight: 600;
            color: #f1f5f9;
        }
        .header .status {
            display: inline-block;
            margin-top: 0.5rem;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.85rem;
            font-weight: 500;
        }
        .status.ok { background: #05966922; color: #34d399; border: 1px solid #05966944; }
        .status.error { background: #dc262622; color: #f87171; border: 1px solid #dc262644; }

        .updated {
            text-align: center;
            color: #64748b;
            font-size: 0.8rem;
            margin-top: 0.5rem;
        }

        #update-bar {
            position: fixed;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            height: 3px;
            background: #38bdf8;
            width: 100%;
            animation: shrink 10s linear forwards;
            z-index: 1000;
        }

        @keyframes shrink {
            from { width: 100%; opacity: 1; }
            to { width: 0%; opacity: 0.25; }
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.25rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .main-layout {
            display: flex;
            gap: 1.25rem;
            align-items: flex-start;
            max-width: 1400px;
            margin: 0 auto;
        }
        .left-column {
            flex: 0 0 320px;
            position: sticky;
            top: 1rem;
        }
        .right-column {
            flex: 1 1 auto;
            min-width: 0;
        }

        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 1.25rem;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }
        .card h2 {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #94a3b8;
            margin-bottom: 0.75rem;
            font-weight: 600;
        }

        .metric {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.5rem 0;
            border-bottom: 1px solid #1e293b;
        }
        .metric:last-child { border-bottom: none; }
        .metric .label { color: #94a3b8; font-size: 0.9rem; }
        .metric .value { font-weight: 600; font-size: 0.95rem; }
        .value.ok { color: #34d399; }
        .value.error { color: #f87171; }
        .value.warn { color: #fbbf24; }

        .bar {
            width: 100%;
            height: 6px;
            background: #334155;
            border-radius: 3px;
            margin-top: 0.4rem;
            overflow: hidden;
        }
        .bar-fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.3s ease;
        }
        .bar-fill.ok { background: #059669; }
        .bar-fill.warn { background: #d97706; }
        .bar-fill.error { background: #dc2626; }

        .error-box {
            background: #7f1d1d22;
            border: 1px solid #dc262644;
            color: #fca5a5;
            padding: 0.75rem;
            border-radius: 8px;
            margin-top: 0.5rem;
            font-size: 0.85rem;
            word-break: break-word;
        }

        .history-section {
            max-width: 1200px;
            margin: 2rem auto 0;
        }
        .history-section h2 {
            font-size: 1rem;
            color: #94a3b8;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }
        .filters {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }
        .filters button {
            background: #1e293b;
            border: 1px solid #334155;
            color: #94a3b8;
            padding: 0.4rem 0.9rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 500;
        }
        .filters button:hover {
            border-color: #64748b;
            color: #e2e8f0;
        }
        .filters button.active {
            background: #2563eb22;
            border-color: #2563eb88;
            color: #60a5fa;
        }
        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 1.25rem;
        }
        .chart-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 1rem;
        }
        .chart-card h3 {
            font-size: 0.8rem;
            text-transform: uppercase;
            color: #64748b;
            margin-bottom: 0.5rem;
        }
        canvas {
            max-height: 200px;
        }
        .log-btn {
            display: block;
            width: 100%;
            margin-top: 0.5rem;
            padding: 0.6rem;
            background: #1e293b;
            border: 1px solid #334155;
            color: #94a3b8;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            text-align: left;
        }
        .log-btn:hover {
            border-color: #64748b;
            color: #e2e8f0;
        }
        .log-controls {
            display: flex;
            gap: 0.5rem;
            align-items: center;
            flex-wrap: wrap;
        }
        .log-controls select {
            background: #1e293b;
            border: 1px solid #334155;
            color: #e2e8f0;
            padding: 0.4rem 0.6rem;
            border-radius: 6px;
            font-size: 0.85rem;
        }
        .log-controls .log-btn {
            margin-top: 0;
            text-align: center;
        }
        .pipeline-flow-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 1rem;
            margin-top: 1rem;
        }
        .pipeline-flow-card h2 {
            font-size: 1rem;
            color: #e2e8f0;
            margin-bottom: 0.75rem;
        }
        .pipeline-diagram {
            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: 0.25rem;
        }
        .pipeline-step {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: space-between;
            gap: 0.75rem;
            padding: 0.5rem 0.75rem;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #94a3b8;
            font-size: 0.8rem;
            min-width: 280px;
            text-align: left;
            transition: all 0.3s;
        }
        .pipeline-step.active {
            border-color: #2563eb;
            background: #2563eb22;
            color: #60a5fa;
            box-shadow: 0 0 12px rgba(37, 99, 235, 0.3);
        }
        .pipeline-step.completed {
            border-color: #059669;
            background: #05966922;
            color: #34d399;
        }
        .pipeline-step.failed {
            border-color: #dc2626;
            background: #dc262622;
            color: #f87171;
        }
        .pipeline-step.idle {
            border-color: #64748b;
            background: #0f172a;
            color: #64748b;
        }
        .pipeline-arrow {
            color: #64748b;
            font-size: 1.2rem;
            font-weight: bold;
            line-height: 1;
            text-align: center;
        }
        .pipeline-history {
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
            align-items: flex-end;
        }
        .pipeline-history-item {
            font-size: 0.7rem;
            padding: 0.15rem 0.4rem;
            border-radius: 4px;
            background: #0f172a;
            border: 1px solid #334155;
            color: #94a3b8;
            white-space: nowrap;
        }
        .pipeline-history-item.status-running {
            border-color: #2563eb44;
            color: #60a5fa;
        }
        .pipeline-history-item.status-completed {
            border-color: #05966944;
            color: #34d399;
        }
        .pipeline-history-item.status-failed,
        .pipeline-history-item.status-aborted {
            border-color: #dc262644;
            color: #f87171;
        }
        .pipeline-history-item.status-starting {
            border-color: #fbbf2444;
            color: #fbbf24;
        }
    </style>
</head>
<body>
    <div id="update-bar"></div>
    <div class="header">
        <h1>Server Health Dashboard</h1>
        <div id="status-badge" class="status">Loading...</div>
        <div class="updated" id="updated"></div>
    </div>

    <div class="main-layout">
        <div class="left-column">
            <div class="pipeline-flow-card">
                <h2>Pipeline Flow</h2>
                <div id="pipeline-diagram">Loading...</div>
            </div>
        </div>
        <div class="right-column">
            <div class="dashboard">
                <div class="card" id="pipeline-card">
                    <h2>Pipeline Status</h2>
                    <div id="pipeline-content">Loading...</div>
                </div>
                <div class="card" id="server-card">
                    <h2>Server</h2>
                    <div id="server-content">Loading...</div>
                </div>
                <div class="card" id="network-card">
                    <h2>Network</h2>
                    <div id="network-content">Loading...</div>
                </div>
                <div class="card" id="db-card">
                    <h2>Databases</h2>
                    <div id="db-content">Loading...</div>
                </div>
                <div class="card" id="logs-card">
                    <h2>Logs</h2>
                    <div id="logs-content">
                        <div class="log-controls">
                            <select id="log-type">
                                <option value="all">Alles</option>
                                <option value="arangodb">ArangoDB</option>
                                <option value="postgis">PostGIS</option>
                                <option value="rsa">RSA</option>
                            </select>
                            <select id="log-range">
                                <option value="1d">Laatste dag</option>
                                <option value="all">Alles</option>
                            </select>
                            <button id="log-download" class="log-btn">Download logs</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="history-section">
                <h2>History</h2>
                <div class="filters">
                    <button data-range="5m">5m</button>
                    <button data-range="1h" class="active">1h</button>
                    <button data-range="12h">12h</button>
                    <button data-range="1d">1d</button>
                    <button data-range="7d">7d</button>
                    <button data-range="1mo">1mo</button>
                </div>
                <div class="charts-grid">
                    <div class="chart-card">
                        <h3>CPU %</h3>
                        <canvas id="cpuChart"></canvas>
                    </div>
                    <div class="chart-card">
                        <h3>Memory %</h3>
                        <canvas id="memChart"></canvas>
                    </div>
                    <div class="chart-card">
                        <h3>Disk %</h3>
                        <canvas id="diskChart"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const statusBadge = document.getElementById('status-badge');
        const serverContent = document.getElementById('server-content');
        const networkContent = document.getElementById('network-content');
        const dbContent = document.getElementById('db-content');
        const pipelineContent = document.getElementById('pipeline-content');
        const updatedEl = document.getElementById('updated');

        let cpuChart, memChart, diskChart;
        let currentRange = '1h';

        document.querySelectorAll('.log-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const logKey = btn.dataset.log;
                window.location.href = `/logs/${logKey}`;
            });
        });

        document.getElementById('log-download').addEventListener('click', () => {
            const type = document.getElementById('log-type').value;
            const range = document.getElementById('log-range').value;
            window.location.href = `/logs?type=${encodeURIComponent(type)}&range=${encodeURIComponent(range)}`;
        });

        function setRange(range) {
            currentRange = range;
            document.querySelectorAll('.filters button').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.range === range);
            });
        }

        document.querySelectorAll('.filters button').forEach(btn => {
            btn.addEventListener('click', () => {
                setRange(btn.dataset.range);
                updateChartsOnly();
            });
        });

        function pctColor(pct) {
            if (pct < 70) return 'ok';
            if (pct < 90) return 'warn';
            return 'error';
        }

        function renderBar(value, total) {
            const pct = total ? Math.round((value / total) * 100) : 0;
            const color = pctColor(pct);
            return `<div class="bar"><div class="bar-fill ${color}" style="width:${pct}%"></div></div>`;
        }

        function renderSection(data) {
            if (data.memory) {
                const color = pctColor(data.memory.percent);
                return `
                    <div class="metric"><span class="label">Memory</span><span class="value ${color}">${data.memory.used_gb} / ${data.memory.total_gb} GB (${data.memory.percent}%)</span></div>
                    ${renderBar(data.memory.used_gb, data.memory.total_gb)}
                `;
            }
            if (data.disk) {
                const color = pctColor(data.disk.percent);
                return `
                    <div class="metric"><span class="label">Disk</span><span class="value ${color}">${data.disk.used_gb} / ${data.disk.total_gb} GB (${data.disk.percent}%)</span></div>
                    ${renderBar(data.disk.used_gb, data.disk.total_gb)}
                `;
            }
            return '';
        }

        const PIPELINE_STEPS = [
            { id: 'idle', label: 'Idle' },
            { id: 'sharepoint_to_drive', label: 'SP → Drive' },
            { id: 'drive_download', label: 'Drive Download' },
            { id: 'arango_sync', label: 'Arango Sync' },
            { id: 'postgis_sync_pausing', label: 'PostGIS Pauzeren' },
            { id: 'postgis_sync_paused', label: 'PostGIS Gepauzeerd' },
            { id: 'rsa_queries', label: 'RSA Queries' },
            { id: 'postgis_sync_resuming', label: 'PostGIS Hervatten' },
            { id: 'postgis_sync_running', label: 'PostGIS Loopt' },
            { id: 'drive_upload', label: 'Drive Upload' },
            { id: 'drive_to_sharepoint', label: 'Drive → SP' },
        ];

        function renderPipelineDiagram(pipeline) {
            const container = document.getElementById('pipeline-diagram');
            if (!container) return;

            const currentPhase = pipeline?.current?.phase || 'idle';
            const currentStatus = pipeline?.current?.status || 'completed';
            const history = pipeline?.history || {};

            const statusClass = (status) => {
                if (status === 'completed') return 'completed';
                if (status === 'failed' || status === 'aborted') return 'failed';
                if (status === 'starting') return 'starting';
                return 'running';
            };

            const STATUS_ORDER = { starting: 0, running: 1, completed: 2, failed: 3, aborted: 4 };

            const formatTime = (iso) => {
                if (!iso) return '';
                const d = new Date(iso);
                return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            };

            let html = '<div class="pipeline-diagram">';
            PIPELINE_STEPS.forEach((step, idx) => {
                let stepClass = 'idle';
                if (step.id === currentPhase) {
                    stepClass = currentStatus === 'completed' ? 'completed' : currentStatus === 'failed' || currentStatus === 'aborted' ? 'failed' : 'active';
                } else if (step.id !== 'idle') {
                    const stepIdx = PIPELINE_STEPS.findIndex(s => s.id === currentPhase);
                    if (stepIdx >= 0 && idx < stepIdx) {
                        stepClass = 'completed';
                    }
                } else if (step.id === 'idle' && currentPhase === 'idle') {
                    stepClass = currentStatus === 'completed' ? 'completed' : 'idle';
                }

                html += `<div class="pipeline-step ${stepClass}">`;
                html += `<div>${step.label}</div>`;
                const phaseHistory = history[step.id];
                if (phaseHistory && phaseHistory.length > 0) {
                    const sorted = [...phaseHistory].sort((a, b) => (STATUS_ORDER[a.status] ?? 99) - (STATUS_ORDER[b.status] ?? 99));
                    html += '<div class="pipeline-history">';
                    sorted.forEach((entry) => {
                        html += `<span class="pipeline-history-item status-${statusClass(entry.status)}">${entry.status} · ${formatTime(entry.updated_at)}</span>`;
                    });
                    html += '</div>';
                }
                html += '</div>';
                if (idx < PIPELINE_STEPS.length - 1) {
                    html += '<div class="pipeline-arrow">↓</div>';
                }
            });
            html += '</div>';
            container.innerHTML = html;
        }

        function render(data, pipeline) {
            const dbEntries = data.databases || {};
            const dbKeys = Object.keys(dbEntries);
            const anyDbError = dbKeys.some(k => dbEntries[k].status === 'error');

            statusBadge.textContent = data.running ? 'Running' : 'Stopped';
            statusBadge.className = 'status ' + (data.running && !anyDbError ? 'ok' : 'error');

            updatedEl.textContent = 'Updated: ' + new Date().toLocaleString();

            let pipelineHtml = '';
            if (pipeline && pipeline.current) {
                const statusClass = pipeline.current.status === 'completed' ? 'ok' : pipeline.current.status === 'failed' || pipeline.current.status === 'aborted' ? 'error' : 'warn';
                pipelineHtml += `
                    <div class="metric"><span class="label">Phase</span><span class="value">${pipeline.current.phase || 'idle'}</span></div>
                    <div class="metric"><span class="label">Status</span><span class="value ${statusClass}">${(pipeline.current.status || 'unknown').toUpperCase()}</span></div>
                    <div class="metric"><span class="label">Updated</span><span class="value">${pipeline.current.updated_at ? new Date(pipeline.current.updated_at).toLocaleString() : '-'}</span></div>
                `;
                if (pipeline.current.message) {
                    pipelineHtml += `<div class="error-box">${pipeline.current.message}</div>`;
                }
            } else {
                pipelineHtml = 'No pipeline data';
            }
            pipelineContent.innerHTML = pipelineHtml;
            renderPipelineDiagram(pipeline);

            const server = data.server || {};
            let serverHtml = '';
            if (server.cpu_percent !== undefined) {
                const color = pctColor(server.cpu_percent);
                serverHtml += `<div class="metric"><span class="label">CPU</span><span class="value ${color}">${server.cpu_percent}%</span></div>`;
            }
            if (server.memory) {
                serverHtml += renderSection(server.memory);
            }
            if (server.disk) {
                serverHtml += renderSection(server.disk);
            }
            serverContent.innerHTML = serverHtml || 'No data';

            const net = data.network || {};
            let netHtml = '';
            if (net.status === 'ok') {
                const color = pctColor(Math.min(net.latency_ms / 100, 100));
                netHtml = `
                    <div class="metric"><span class="label">Target</span><span class="value">${net.target}</span></div>
                    <div class="metric"><span class="label">Status</span><span class="value ok">OK</span></div>
                    <div class="metric"><span class="label">Latency</span><span class="value ${color}">${net.latency_ms} ms</span></div>
                `;
            } else {
                netHtml = `
                    <div class="metric"><span class="label">Status</span><span class="value error">Error</span></div>
                    <div class="error-box">${net.error || 'Unknown'}</div>
                `;
            }
            networkContent.innerHTML = netHtml;

            let dbHtml = '';
            for (const [name, info] of Object.entries(dbEntries)) {
                const color = info.status === 'ok' ? 'ok' : 'error';
                dbHtml += `
                    <div class="metric"><span class="label">${name}</span><span class="value ${color}">${info.status.toUpperCase()}</span></div>
                `;
                if (info.latency_ms !== undefined) {
                    dbHtml += `<div class="metric"><span class="label">Latency</span><span class="value">${info.latency_ms} ms</span></div>`;
                }
                if (info.error) {
                    dbHtml += `<div class="error-box">${info.error}</div>`;
                }
            }

            dbContent.innerHTML = dbHtml || 'No databases configured';
        }

        function updateCharts(history) {
            const snapshots = history?.snapshots || [];
            const labels = snapshots.map(s => {
                const d = new Date(s.timestamp);
                return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            });
            const cpuData = snapshots.map(s => s.cpu_percent ?? null);
            const memData = snapshots.map(s => s.mem_percent ?? null);
            const diskData = snapshots.map(s => s.disk_percent ?? null);

            const makeColor = (val) => {
                if (val === null || val === undefined) return '#64748b';
                if (val < 70) return '#059669';
                if (val < 90) return '#d97706';
                return '#dc2626';
            };

            const createDataset = (data, label) => ({
                data,
                borderColor: '#38bdf8',
                backgroundColor: 'rgba(56,189,248,0.1)',
                borderWidth: 2,
                pointRadius: 0,
                tension: 0.3,
                fill: true,
            });

            const makeChart = (ctx, data, label, color) => ({
                type: 'line',
                data: {
                    labels,
                    datasets: [createDataset(data, label)],
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    animation: { duration: 0 },
                    plugins: { legend: { display: false } },
                    scales: {
                        x: {
                            ticks: { color: '#64748b', maxTicksLimit: 6, font: { size: 10 } },
                            grid: { color: '#1e293b' },
                        },
                        y: {
                            min: 0,
                            max: 100,
                            ticks: { color: '#64748b', font: { size: 10 } },
                            grid: { color: '#1e293b' },
                        },
                    },
                },
                plugins: [{
                    id: 'pointColor',
                    afterDatasetDraw(chart, args, options) {
                        const ctx = chart.ctx;
                        const ds = chart.data.datasets[0];
                        chart.data.labels.forEach((_, i) => {
                            const val = ds.data[i];
                            if (val === null || val === undefined) return;
                            const x = chart.getDatasetMeta(0).data[i]?.x;
                            const y = chart.getDatasetMeta(0).data[i]?.y;
                            if (x === undefined) return;
                            ctx.beginPath();
                            ctx.arc(x, y, 3, 0, 2 * Math.PI);
                            ctx.fillStyle = makeColor(val);
                            ctx.fill();
                        });
                    }
                }],
            });

            const cpuCtx = document.getElementById('cpuChart');
            const memCtx = document.getElementById('memChart');
            const diskCtx = document.getElementById('diskChart');

            if (cpuChart) cpuChart.destroy();
            if (memChart) memChart.destroy();
            if (diskChart) diskChart.destroy();

            cpuChart = new Chart(cpuCtx, makeChart(cpuCtx, cpuData, 'CPU %', '#38bdf8'));
            memChart = new Chart(memCtx, makeChart(memCtx, memData, 'Memory %', '#34d399'));
            diskChart = new Chart(diskCtx, makeChart(diskCtx, diskData, 'Disk %', '#fbbf24'));
        }

        function triggerUpdateBar() {
            const existing = document.getElementById('update-bar');
            if (existing) existing.remove();
            const bar = document.createElement('div');
            bar.id = 'update-bar';
            document.body.prepend(bar);
        }

        async function load() {
            triggerUpdateBar();
            try {
                const [healthRes, historyRes, pipelineRes] = await Promise.all([
                    fetch('/health'),
                    fetch(`/history?range=${currentRange}&limit=500`),
                    fetch('/pipeline/state'),
                ]);
                const healthData = await healthRes.json();
                const historyData = await historyRes.json();
                const pipelineData = await pipelineRes.json();
                render(healthData, pipelineData);
                updateCharts(historyData);
            } catch (e) {
                serverContent.innerHTML = '<div class="error-box">Failed to load health data</div>';
            }
        }

        async function updateChartsOnly() {
            try {
                const historyRes = await fetch(`/history?range=${currentRange}&limit=500`);
                const historyData = await historyRes.json();
                updateCharts(historyData);
            } catch (e) {
                console.error('Failed to load history:', e);
            }
        }

        load();
        setInterval(load, 10000);
    </script>
</body>
</html>
