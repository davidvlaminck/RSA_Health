# Example configuration file
# Copy this to config.toml and fill in your real credentials

[[databases]]
type = "arangodb"
host = "localhost"
port = 8529
username = "root"
password = "changeme"
database = "_system"

[[databases]]
type = "postgresql"
host = "localhost"
port = 5432
username = "postgres"
password = "changeme"
database = "awvinfra"

[drive]
credentials_file = "/path/to/client_secret.json"
token_file = "/path/to/gdrive_token.pkl"
folder_id = "your-drive-folder-id"
poll_interval_seconds = 60

[logs]
directory = "/var/log/rsa-health"
